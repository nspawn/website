# Local preview of nspawn.org without installing anything on the host:
#
#   docker compose up
#
# then open http://localhost:1313. Edits under content/, assets/ and layouts/ reload live.
# If your uid/gid are not 1000, pass them (env SITE_UID=$(id -u) SITE_GID=$(id -g) docker compose up) so that
# node_modules/ and the build output belong to you.
services:
  site:
    build: .
    image: nspawn-website-dev
    user: "${SITE_UID:-1000}:${SITE_GID:-1000}"
    ports:
      - "127.0.0.1:1313:1313"
    volumes:
      - .:/site
      - cache:/cache

volumes:
  cache:
